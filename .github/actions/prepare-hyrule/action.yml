name: Generate Hyrule sources
description: Verify committed Hyrule Go is fresh, generate ignored Markdown with the pinned compiler, then use standalone module dependencies. Hyrule and Boiler are pinned independently.
runs:
  using: composite
  steps:
    - name: Verify pinned generators
      shell: bash
      run: |
        # Check committed output before any target regenerates it.
        BOILER_PINNED=1 GOTOOLCHAIN=go1.27.0 sh scripts/boiler.sh generate --check
        HYRULE_PINNED=1 GOTOOLCHAIN=go1.27.0 sh scripts/hyrule.sh generate --check
        GOTOOLCHAIN=go1.27.0 make generated-markdown
        echo 'GOWORK=off' >> "$GITHUB_ENV"
