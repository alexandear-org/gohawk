name: Generate Hyrule sources
description: Generate ignored Go and Markdown with the pinned compiler, then use standalone module dependencies.
runs:
  using: composite
  steps:
    - name: Prepare generator workspace
      shell: bash
      run: |
        git init ../lockdoc
        git -C ../lockdoc fetch --depth=1 https://github.com/kojah/lockdoc.git 0df82e3383285bcf8412ae10835cb1f3ef682d13
        git -C ../lockdoc checkout --detach FETCH_HEAD
        GOTOOLCHAIN=go1.27.0 go work init . ../lockdoc
        GOTOOLCHAIN=go1.27.0 make generated-markdown
        echo 'GOWORK=off' >> "$GITHUB_ENV"
