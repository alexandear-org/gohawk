name: Generate Hyrule sources
description: Generate ignored Go sources with the pinned compiler, then use standalone module dependencies.
runs:
  using: composite
  steps:
    - name: Prepare generator workspace
      shell: bash
      run: |
        git init ../lockdoc
        git -C ../lockdoc fetch --depth=1 https://github.com/kojah/lockdoc.git 5a0c4283df47b55d8d4d524cd1d6b272e3515dc1
        git -C ../lockdoc checkout --detach FETCH_HEAD
        GOTOOLCHAIN=go1.27.0 go work init . ../lockdoc
        GOTOOLCHAIN=go1.27.0 make hyrule-generate
        echo 'GOWORK=off' >> "$GITHUB_ENV"
