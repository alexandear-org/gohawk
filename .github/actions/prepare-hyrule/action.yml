name: Generate Hyrule sources
description: Verify committed Hyrule Go is fresh, generate ignored Markdown with the pinned compiler, then use standalone module dependencies.
runs:
  using: composite
  steps:
    - name: Prepare generator workspace
      shell: bash
      run: |
        git init ../lockdoc
        git -C ../lockdoc fetch --depth=1 https://github.com/kojah/lockdoc.git f0d9b07a9fdcc42a406ba293c2576f1341cb193d
        git -C ../lockdoc checkout --detach FETCH_HEAD
        GOTOOLCHAIN=go1.27.0 go work init . ../lockdoc
        # Check committed output before any target regenerates it.
        GOTOOLCHAIN=go1.27.0 sh scripts/boiler.sh generate --check
        GOTOOLCHAIN=go1.27.0 sh scripts/hyrule.sh generate --check
        GOTOOLCHAIN=go1.27.0 make generated-markdown
        echo 'GOWORK=off' >> "$GITHUB_ENV"
