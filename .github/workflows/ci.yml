name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run fast static checks and Hyrule contracts
        run: make verify-static

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run golangci-lint
        run: make lint

  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Check reachable dependencies for vulnerabilities
        run: make vuln

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Build and dogfood gohawk
        run: make dogfood

  race:
    name: targeted race tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run race-enabled tests
        run: make test-race

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Test the golangci-lint plugin
        run: make plugin-test

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Collect coverage
        # Measure product analysis behavior, not CLI and documentation tooling.
        run: make coverage

      - name: Upload coverage receipts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.out

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05 # v3
        with:
          filename: coverage-summary.out
          link: https://github.com/kojah/gohawk/actions/workflows/ci.yml

      - name: Check coverage badge
        run: git diff --exit-code -- README.md

  compatibility:
    name: compatibility (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', '1.27']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up build toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Build compatibility binary
        run: go build -o "$RUNNER_TEMP/gohawk" .

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: "${{ matrix.go-version }}.x"
          cache: false

      - name: Analyze with Go ${{ matrix.go-version }}
        run: scripts/test-toolchain-compatibility.sh "$RUNNER_TEMP/gohawk" "${{ matrix.go-version }}"

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      # Generated Go is committed and checked by static-fast on Linux. Only the
      # ignored documentation used by architecture tests needs generating here.
      - name: Generate Markdown references
        run: go run ./tools/gendocs -generated-markdown

      - name: Run native Windows tests
        run: go test -p=2 -parallel=4 ./...

      - name: Build Windows CLI
        run: go build -o "$env:RUNNER_TEMP/gohawk.exe" .

      - name: Smoke-test analysis in a path with spaces
        shell: pwsh
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'gohawk.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'gohawk smoke'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          @'
          module example.com/windows-smoke

          go 1.26.0
          '@ | Set-Content -Path (Join-Path $fixture 'go.mod')
          @'
          package sample

          import "os"

          func leak(path string) error {
              file, err := os.Open(path)
              if err != nil {
                  return err
              }
              _ = file
              return nil
          }

          func safe(path string) error {
              file, err := os.Open(path)
              if err != nil {
                  return err
              }
              defer file.Close()
              return nil
          }
          '@ | Set-Content -Path (Join-Path $fixture 'sample.go')
          Set-Location $fixture
          # Findings intentionally produce exit 3; validate it before parsing JSON.
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & $binary -enable=resourcelifetime -json ./...
          if ($LASTEXITCODE -ne 3) {
              throw "Expected diagnostic exit 3, got $LASTEXITCODE`: $output"
          }
          $diagnostics = ($output -join "`n") | ConvertFrom-Json
          $findings = @($diagnostics.'example.com/windows-smoke'.resourcelifetime)
          if ($findings.Count -ne 1 -or $findings[0].category -ne 'resourcelifetime/missing-release') {
              throw "Expected exactly one resource leak and no finding for safe: $output"
          }
          # The runner otherwise propagates the expected native exit code 3.
          exit 0

  exhaustive-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Generate Go sources
        uses: ./.github/actions/prepare-hyrule

      - name: Run exhaustive CLI subprocess matrix
        run: make test-exhaustive

  skills:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check installed skill revisions
        env:
          GH_TOKEN: ${{ secrets.SKILL_VAULT_TOKEN }}
        run: make skills-check

  # Preserve the existing aggregate check name while the expensive verification
  # work runs concurrently in the jobs above.
  test:
    if: ${{ always() }}
    needs: [static-fast, lint, vulnerability, dogfood, race, plugin, coverage, compatibility, windows, exhaustive-cli, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Check verification results
        env:
          STATIC_FAST_RESULT: ${{ needs.static-fast.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          VULNERABILITY_RESULT: ${{ needs.vulnerability.result }}
          DOGFOOD_RESULT: ${{ needs.dogfood.result }}
          RACE_RESULT: ${{ needs.race.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          EXHAUSTIVE_CLI_RESULT: ${{ needs.exhaustive-cli.result }}
          SKILLS_RESULT: ${{ needs.skills.result }}
        run: |
          for result in "$STATIC_FAST_RESULT" "$LINT_RESULT" "$VULNERABILITY_RESULT" "$DOGFOOD_RESULT" "$RACE_RESULT" "$PLUGIN_RESULT" "$COVERAGE_RESULT" "$COMPATIBILITY_RESULT" "$WINDOWS_RESULT" "$EXHAUSTIVE_CLI_RESULT"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
          if [[ "$SKILLS_RESULT" != "success" && "$SKILLS_RESULT" != "skipped" ]]; then
            exit 1
          fi
