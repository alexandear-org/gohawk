version: 1
targets:
  - name: select_comparison
    package: internal/engine/ssaflow/selection
    bindings: internal/engine/ssaflow/selection/comparison.go
    signature: ComparisonSignature
    function: Recognize
    rules: [internal/engine/ssaflow/selection/comparison.rules]
    out: internal/engine/ssaflow/selection/comparison_gen.go
  - name: synchronization_primitives
    package: internal/engine/ssaflow/calls/synchronization
    bindings: internal/engine/ssaflow/calls/synchronization/primitives.go
    signature: PrimitiveSignature
    function: Recognize
    rules: [internal/engine/ssaflow/calls/synchronization/primitives.rules]
    out: internal/engine/ssaflow/calls/synchronization/primitives_gen.go
  - name: mutex_storage_contract
    package: internal/engine/ssaflow/calls/synchronization
    bindings: internal/engine/ssaflow/calls/synchronization/mutex.go
    signature: MutexEffectSignature
    function: MutexEffect
    rules: [internal/engine/ssaflow/calls/synchronization/mutex.rules]
    out: internal/engine/ssaflow/calls/synchronization/mutex_gen.go
  - name: process_return_decision
    package: internal/analysis/analyzers/resources/processownership
    bindings: internal/analysis/analyzers/resources/processownership/decision_bindings.go
    signature: processReturnSignature
    function: decideProcessReturn
    rules: [internal/analysis/analyzers/resources/processownership/decision.rules]
    out: internal/analysis/analyzers/resources/processownership/decision_gen.go
  - name: transparent_value_form
    package: internal/engine/ssaflow/valueforms
    bindings: internal/engine/ssaflow/valueforms/forms.go
    signature: Signature
    function: Unwrap
    rules: [internal/engine/ssaflow/valueforms/forms.rules]
    out: internal/engine/ssaflow/valueforms/forms_gen.go
  - name: ownership_value_source
    package: internal/engine/ssaflow/valueforms
    bindings: internal/engine/ssaflow/valueforms/ownership.go
    signature: OwnershipSignature
    function: OwnershipSource
    rules: [internal/engine/ssaflow/valueforms/ownership.rules]
    out: internal/engine/ssaflow/valueforms/ownership_gen.go
  - name: deferred_resource_use
    package: internal/analysis/analyzers/resources/deferinloop
    bindings: internal/analysis/analyzers/resources/deferinloop/classify_bindings.go
    signature: useSignature
    function: classifyValueUse
    rules: [internal/analysis/analyzers/resources/deferinloop/classify.rules]
    out: internal/analysis/analyzers/resources/deferinloop/classify_gen.go
  - name: deferred_resource_acquisition
    package: internal/analysis/analyzers/resources/deferinloop
    bindings: internal/analysis/analyzers/resources/deferinloop/obligation.go
    signature: acquisitionSignature
    function: classifyResourceAcquisition
    rules: [internal/analysis/analyzers/resources/deferinloop/acquisition.rules]
    out: internal/analysis/analyzers/resources/deferinloop/acquisition_gen.go
  - name: cancellation_instruction_label
    package: internal/analysis/analyzers/resources/cancellationownership
    bindings: internal/analysis/analyzers/resources/cancellationownership/classify_bindings.go
    signature: classifySignature
    function: classifyCancellation
    rules: [internal/analysis/analyzers/resources/cancellationownership/label_schema.rules, internal/analysis/analyzers/resources/cancellationownership/classify.rules]
    out: internal/analysis/analyzers/resources/cancellationownership/classify_gen.go
  - name: cancellation_call_label
    package: internal/analysis/analyzers/resources/cancellationownership
    bindings: internal/analysis/analyzers/resources/cancellationownership/classify_bindings.go
    signature: callLabelSignature
    function: recognizeCancellationCall
    rules: [internal/analysis/analyzers/resources/cancellationownership/label_schema.rules, internal/analysis/analyzers/resources/cancellationownership/call_label.rules]
    out: internal/analysis/analyzers/resources/cancellationownership/call_label_gen.go
  - name: cancellation_argument_label
    package: internal/analysis/analyzers/resources/cancellationownership
    bindings: internal/analysis/analyzers/resources/cancellationownership/classify_bindings.go
    signature: argumentLabelSignature
    function: recognizeCancellationArgument
    rules: [internal/analysis/analyzers/resources/cancellationownership/label_schema.rules, internal/analysis/analyzers/resources/cancellationownership/argument_label.rules]
    out: internal/analysis/analyzers/resources/cancellationownership/argument_label_gen.go
  - name: cancellation_recognized_label
    package: internal/analysis/analyzers/resources/cancellationownership
    bindings: internal/analysis/analyzers/resources/cancellationownership/classify_bindings.go
    signature: callLabelSignature
    function: recognizeCancellation
    rules: [internal/analysis/analyzers/resources/cancellationownership/label_schema.rules, internal/analysis/analyzers/resources/cancellationownership/recognized_label.rules]
    out: internal/analysis/analyzers/resources/cancellationownership/recognized_label_gen.go
  - name: cancellation_direct_label
    package: internal/analysis/analyzers/resources/cancellationownership
    bindings: internal/analysis/analyzers/resources/cancellationownership/classify_bindings.go
    signature: callLabelSignature
    function: recognizeCancellationDirect
    rules: [internal/analysis/analyzers/resources/cancellationownership/label_schema.rules, internal/analysis/analyzers/resources/cancellationownership/direct_label.rules]
    out: internal/analysis/analyzers/resources/cancellationownership/direct_label_gen.go
  - name: cancellation_deferred_label
    package: internal/analysis/analyzers/resources/cancellationownership
    bindings: internal/analysis/analyzers/resources/cancellationownership/classify_bindings.go
    signature: argumentLabelSignature
    function: recognizeCancellationDeferredUse
    rules: [internal/analysis/analyzers/resources/cancellationownership/label_schema.rules, internal/analysis/analyzers/resources/cancellationownership/deferred_label.rules]
    out: internal/analysis/analyzers/resources/cancellationownership/deferred_label_gen.go
  - name: cancellation_return_label
    package: internal/analysis/analyzers/resources/cancellationownership
    bindings: internal/analysis/analyzers/resources/cancellationownership/classify_bindings.go
    signature: returnLabelSignature
    function: classifyCancellationReturn
    rules: [internal/analysis/analyzers/resources/cancellationownership/label_schema.rules, internal/analysis/analyzers/resources/cancellationownership/return_label.rules]
    out: internal/analysis/analyzers/resources/cancellationownership/return_label_gen.go
